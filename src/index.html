<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
    <title>NewsPortal</title>
</head>

<body>
    <header>
        <h1>News Portal</h1>
    </header>
    <main>
        <div class="sources buttons"></div>
        <div class="news"></div>
    </main>

    <footer class="footer">
        <div class="footer__container">

            <a class="footer__rss" href="https://rs.school/courses/javascript" target="_blank" rel="noopener noreferrer">
                <img class="footer__rss-logo" src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School Logo" width="86" height="32" />
            </a>

            <div class="footer__meta">
                <a class="footer__author" href="https://github.com/Val-d-emar" target="_blank" rel="noopener noreferrer">Val-d-emar</a>
                <span class="footer__year">2026</span>
            </div>

            <p class="copyright">
                Data provided by <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI</a>
            </p>
        </div>
    </footer>

    <template id="sourceItemTemp">
        <div class="source__item">
            <span class="source__item-name"></span>
        </div>
    </template>

    <template id="newsItemTemp">
        <div class="news__item">
            <div class="news__meta">
                <div class="news__meta-photo"></div>
                <ul class="news__meta-details">
                    <li class="news__meta-author"></li>
                    <li class="news__meta-date"></li>
                </ul>
            </div>
            <div class="news__description">
                <h2 class="news__description-title"></h2>
                <h3 class="news__description-source"></h3>
                <p class="news__description-content"></p>
                <p class="news__read-more">
                    <a href="#">Read More</a>
                </p>
            </div>
        </div>
    </template>
</body>

</html>
